<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証完了 | 神大ライフハック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% if liff_id %}<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>{% endif %}
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center px-4">
  <div class="max-w-sm w-full">
    <div class="bg-white rounded-3xl shadow-sm p-8 text-center">
      <div class="text-6xl mb-4">✅</div>
      <h1 class="text-xl font-bold text-gray-800 mb-2">メールアドレス認証が完了しました。</h1>
      <p class="text-sm text-gray-500 mb-2">あと少しです。学部・学科を入力して会員登録を完了してください。</p>
      <a href="{{ register_url }}"
        class="block w-full mt-6 bg-indigo-600 text-white font-bold py-3.5 rounded-2xl hover:bg-indigo-700 transition text-sm">
        会員登録を完了する
      </a>
    </div>
  </div>
</body>
</html>

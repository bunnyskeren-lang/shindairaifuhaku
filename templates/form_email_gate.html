<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メール認証 | 神大ライフハック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="{% if IS_DEV %}bg-gradient-to-br from-orange-50 to-amber-100{% else %}bg-gradient-to-br from-blue-50 to-indigo-100{% endif %} min-h-screen pb-16">

  <div class="max-w-md mx-auto px-4 pt-8">

    {% if IS_DEV %}
    <div class="bg-orange-500 text-white text-center text-sm font-bold py-2 px-4 rounded-2xl mb-4">
      🚧 開発環境
    </div>
    {% endif %}

    <div class="text-center mb-6">
      <div class="text-5xl mb-3">📧</div>
      <h1 class="text-2xl font-bold text-gray-800">メールアドレス認証</h1>
      <p class="text-gray-500 text-sm mt-1">初めての投稿の前に、なりすまし防止のため大学メールで本人確認をお願いします</p>
    </div>

    <div class="bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 mb-5 text-sm text-amber-700 flex items-start gap-2">
      <span class="text-lg leading-none mt-0.5">✋</span>
      <span>入力した学籍番号宛（〇〇〇〇〇〇〇@stu.kobe-u.ac.jp）に確認メールをお送りします。届いたリンクをタップすると認証完了です。</span>
    </div>

    <form id="gateForm" action="/api/email/request" method="post" novalidate class="space-y-4">
      <input type="hidden" name="id_token" id="idTokenHidden" value="">

      <div class="bg-white rounded-2xl shadow-sm p-5">
        <label for="reg_name" class="block text-sm font-semibold text-gray-700 mb-2">
          🪪 お名前（漢字） <span class="text-red-500">*</span>
        </label>
        <input type="text" name="reg_name" id="reg_name"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
          placeholder="例：神戸 太郎" required maxlength="50">
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-5">
        <label for="student_id" class="block text-sm font-semibold text-gray-700 mb-1">
          🎓 学籍番号 <span class="text-red-500">*</span>
        </label>
        <p class="text-xs text-gray-400 mb-1">数字7桁＋学部コード（医学部のみ2文字: MM・ME・MH）</p>
        <input type="text" name="student_id" id="student_id"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
          placeholder="例：2345678S（医学部：2345678MM）" required maxlength="9"
          autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <p id="studentIdError" class="hidden mt-1 text-red-500 text-xs">学籍番号が正しくありません（例：2345678S、医学部：2345678MM／アルファベットは大文字で入力してください）</p>
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl hover:bg-indigo-700 transition text-sm">
        確認メールを送信する
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";
    let _liffInitPromise = null;
    function ensureLiffInit() {
      if (!_liffInitPromise) {
        _liffInitPromise = liff.init({ liffId: LIFF_ID });
      }
      return _liffInitPromise;
    }

    document.getElementById('gateForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const sid = document.getElementById('student_id').value.replace(/[\s　]+/g, '').toUpperCase();
      const re = /^\d{7}(MM|ME|MH|[LHJEBSTAZX])$/;
      if (!re.test(sid)) {
        document.getElementById('studentIdError').classList.remove('hidden');
        return;
      }
      document.getElementById('studentIdError').classList.add('hidden');
      document.getElementById('student_id').value = sid;

      try {
        await ensureLiffInit();
        const idToken = liff.isLoggedIn() ? await liff.getIDToken() : null;
        if (!idToken) throw new Error('not logged in');
        document.getElementById('idTokenHidden').value = idToken;
      } catch (err) {
        alert('LINEアプリでのログイン確認に失敗しました。LINEアプリから開き直してください。');
        return;
      }
      e.target.submit();
    });
  </script>
</body>
</html>

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # 毎日9:00 JST (UTC 0:00)。コード変更が無い日でも依存パッケージの更新等による
    # リグレッションを検知するため、pushの有無に関わらず定期実行する
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

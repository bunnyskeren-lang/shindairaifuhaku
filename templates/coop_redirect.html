<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学生協アプリ | 神大ライフハック</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(to bottom right, #eff6ff, #e0e7ff);
    }
    .box { text-align: center; color: #475569; padding: 24px; }
    a.store-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <p id="msg">生協アプリのストアページへ移動します...</p>
    <a id="store-link" class="store-btn" href="#">ストアを開く</a>
  </div>

  <script>
    // 正式なディープリンクスキームは非公開・未特定のため、推測スキームへの遷移は行わない
    // （無効なスキームへのアクセスはOS側の確認ダイアログが余計に増えるだけで開けないため）。
    // 正しいスキームが判明したら、ここで location.href = "scheme://" を試行してから
    // フォールバックする方式に戻すこと。
    const IOS_STORE_URL = "https://apps.apple.com/jp/app/%E5%A4%A7%E5%AD%A6%E7%94%9F%E5%8D%94%E3%82%A2%E3%83%97%E3%83%AA-%E5%85%AC%E5%BC%8F/id1604711094";
    const ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=jp.coremobile.daigaku";
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const storeUrl = isIOS ? IOS_STORE_URL : ANDROID_STORE_URL;

    document.getElementById('store-link').href = storeUrl;
    location.replace(storeUrl);
  </script>
</body>
</html>

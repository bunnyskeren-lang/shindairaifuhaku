name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # GitHub Actions画面の「Run workflow」ボタンから任意タイミングで手動実行できる。
  # 定期(cron)実行は不要という判断のため、pushの無い日は自動実行されない。
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

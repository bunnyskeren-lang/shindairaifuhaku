<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業レビュー投稿 | 神大ライフハック</title>
  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="preconnect" href="{{ base_url }}">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(to bottom right, #eff6ff, #e0e7ff);
    }
    .box { text-align: center; color: #475569; padding: 0 24px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 12px;
      border: 4px solid #c7d2fe;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loginBtn {
      margin-top: 16px;
      background: #6366f1;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <p id="msg">読み込み中...</p>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "{{ liff_id }}";
    const BASE_URL = "{{ base_url }}";
    const REDIRECT_PATH = "{{ redirect_path }}";

    // 修正理由: 以前はここでliff.init()した後、未ログインなら何もせずBASE_URL+REDIRECT_PATH
    // （別パス、LIFFのエンドポイントURLとして未登録）へ遷移し、そちらのページでliff.login()を
    // 呼んでいた。LINEログインはliff.init()したページ（=LIFFエンドポイントURLそのもの）上で
    // ログインを完結させる前提のため、別パスからredirectUriを渡すと認可リクエストが
    // 400 Bad Requestになっていた（2026-08-30、外部ブラウザ経由のアクセスで発覚）。
    // このページ自身のURLでログインを完結させ、ログイン後にuserIdを持ってREDIRECT_PATHへ渡す。
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        console.error('[liff/review] liff.init failed', e);
        document.getElementById('msg').textContent =
          '読み込みに失敗しました: ' + (e && (e.message || e.code || String(e)));
        return;
      }

      if (!liff.isLoggedIn()) {
        const isInClient = (() => { try { return liff.isInClient(); } catch (e) { return false; } })();
        if (isInClient) {
          liff.login({ redirectUri: location.href });
          return;
        }
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').innerHTML =
          'レビュー投稿にはLINEログインが必要です。<br><button type="button" id="loginBtn">LINEでログイン</button>';
        document.getElementById('loginBtn').onclick = () => liff.login({ redirectUri: location.href });
        return;
      }

      let userId = null;
      try {
        const profile = await liff.getProfile();
        userId = profile.userId;
      } catch (e) {
        console.error('[liff/review] getProfile failed', e);
      }
      const params = new URLSearchParams(location.search);
      if (userId) params.set('uid', userId);
      location.replace(`${BASE_URL}${REDIRECT_PATH}?${params.toString()}`);
    }
    main();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学生協アプリを開く | 神大ライフハック</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(to bottom right, #eff6ff, #e0e7ff);
    }
    .box { text-align: center; color: #475569; padding: 24px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 12px;
      border: 4px solid #c7d2fe;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #6366f1; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">生協アプリを起動しています...</p>
    <p id="fallback" style="display:none; font-size: 14px;">
      アプリが開かない場合は<a id="store-link" href="#">こちらからインストール</a>してください。
    </p>
  </div>

  <script>
    const IOS_STORE_URL = "https://apps.apple.com/jp/app/%E5%A4%A7%E5%AD%A6%E7%94%9F%E5%8D%94%E3%82%A2%E3%83%97%E3%83%AA-%E5%85%AC%E5%BC%8F/id1604711094";
    const ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=jp.coremobile.daigaku";
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const storeUrl = isIOS ? IOS_STORE_URL : ANDROID_STORE_URL;

    document.getElementById('store-link').href = storeUrl;

    // アプリが未インストールの場合に備え、一定時間後にストアへフォールバック
    setTimeout(function () {
      document.getElementById('msg').textContent = 'アプリが見つかりませんでした';
      document.getElementById('fallback').style.display = 'block';
    }, 1500);

    location.href = "univcoop://";
  </script>
</body>
</html>

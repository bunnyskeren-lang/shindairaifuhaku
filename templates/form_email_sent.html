<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メール確認のお願い | 神大ライフハック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center px-4">
  <div class="max-w-sm w-full">
    <div class="bg-white rounded-3xl shadow-sm p-8 text-center">
      <div class="text-6xl mb-4">📬</div>
      <h1 class="text-xl font-bold text-gray-800 mb-2">確認メールを送信しました</h1>
      <p class="text-gray-500 text-sm mb-1">初めての投稿ありがとうございます。なりすまし防止のため、以下の大学メール宛に確認リンクをお送りしました。</p>
      <p class="text-indigo-600 font-bold text-sm my-3 break-all">{{ email }}</p>
      <p class="text-gray-400 text-sm mb-6">メール内のリンクをタップすると、レビューの投稿が完了します（30分以内に完了してください）。</p>

      <button type="button" id="resendBtn"
        class="block w-full bg-indigo-50 text-indigo-600 font-bold py-3 rounded-2xl hover:bg-indigo-100 transition text-sm disabled:opacity-50">
        メールを再送信する
      </button>
      <p id="resendStatus" class="text-xs text-gray-400 mt-3 min-h-4"></p>
    </div>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";
    const resendBtn = document.getElementById('resendBtn');
    const resendStatus = document.getElementById('resendStatus');

    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      resendStatus.textContent = '送信中…';
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) throw new Error('not logged in');
        const idToken = await liff.getIDToken();
        const res = await fetch('/api/email/resend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: idToken }),
        });
        const d = await res.json();
        resendStatus.textContent = d.ok ? '再送信しました。メールボックスをご確認ください' : '再送信に失敗しました。時間をおいて投稿フォームからやり直してください';
      } catch (e) {
        resendStatus.textContent = '再送信に失敗しました。時間をおいて投稿フォームからやり直してください';
      } finally {
        resendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

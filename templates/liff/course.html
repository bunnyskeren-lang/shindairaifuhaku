<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科目詳細</title>
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="{{ base_url }}">
<style>
  :root { --accent: {{ '#ea580c' if IS_DEV else '#6366f1' }}; --accent-light: {{ '#fb923c' if IS_DEV else '#818cf8' }}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
         background: #f3f4f6; color: #1f2937; min-height: 100vh; }

  .header {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    padding: 20px 16px 24px;
  }
  .header h1 { font-size: 20px; font-weight: 700; line-height: 1.4; }
  .header .instructor { font-size: 13px; color: #c7d2fe; margin-top: 6px; }
  .header .meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
  }
  .badge-cls  { background: rgba(255,255,255,0.2); color: #e0e7ff; }
  .badge-term { background: rgba(255,255,255,0.15); color: #c7d2fe; }
  .badge-cr   { background: rgba(255,255,255,0.15); color: #c7d2fe; }
  .badge-variant { background: rgba(255,255,255,0.15); color: #fde68a; }

  .card {
    background: #fff; border-radius: 12px; margin: 12px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px;
  }

  .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .rating-label { font-size: 13px; color: #64748b; width: 90px; }
  .stars { font-size: 16px; color: #f59e0b; }
  .no-review { font-size: 13px; color: #94a3b8; }

  .grading { font-size: 13px; color: #374151; line-height: 1.6; }

  .comment-box {
    background: #f8fafc; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; font-size: 13px; color: #334155; line-height: 1.6;
  }
  .comment-box.clamped {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .comment-more {
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    margin: -4px 0 8px 2px; cursor: pointer;
  }

  .dist-row { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px; }
  .dist-label { width: 34px; text-align: right; color: #64748b; flex-shrink: 0; }
  .dist-bar-track { flex: 1; background: #f1f5f9; border-radius: 999px; height: 6px; overflow: hidden; }
  .dist-bar-fill { height: 6px; border-radius: 999px; }
  .dist-count { width: 22px; text-align: right; color: #94a3b8; flex-shrink: 0; }

  .review-controls { padding: 0 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .filter-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #e2e8f0; background: #fff; color: #64748b;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sort-row { display: flex; justify-content: flex-end; }
  .sort-select {
    font-size: 12px; color: #64748b; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 5px 8px; background: #fff;
  }

  .mine-badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff;
    background: var(--accent); border-radius: 999px; padding: 2px 9px; margin-bottom: 8px;
  }
  .card.mine { border: 2px solid var(--accent); }

  .actions { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: block; text-align: center; border-radius: 8px;
    padding: 13px; font-size: 15px; font-weight: 600;
    text-decoration: none; border: none; cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #f1f5f9; color: #4338ca; }
  .btn:active { opacity: .85; }

  #loading { text-align: center; padding: 60px 16px; color: #94a3b8; font-size: 14px; }
  #error   { text-align: center; padding: 40px 16px; color: #ef4444; font-size: 14px; display: none; }

  .blurred { filter: blur(6px); pointer-events: none; user-select: none; }
  #authOverlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(15,23,42,.55);
  }
  #authOverlay .box {
    background: #fff; border-radius: 16px; padding: 24px 20px; max-width: 320px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  #authOverlay .box .icon { font-size: 36px; margin-bottom: 10px; }
  #authOverlay .box p { font-size: 13px; color: #475569; line-height: 1.6; margin-bottom: 14px; }

  .legend { margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
  .legend > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #64748b;
  }
  .legend > summary::-webkit-details-marker { display: none; }
  .legend > summary::after { content: "▾"; color: #94a3b8; font-size: 12px; }
  .legend[open] > summary::after { content: "▴"; }
  .legend .legend-body { margin-top: 10px; }
</style>
</head>
<body>

{% if IS_DEV %}<div style="background:#ea580c;color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:bold">🚧 開発環境</div>{% endif %}
<div id="loading">読み込み中...</div>
<div id="error">科目情報を取得できませんでした。</div>
<div id="authOverlay"><div class="box" id="authOverlayBox">
  <div class="icon">⏳</div>
  <p>確認中...</p>
</div></div>
<div id="content" style="display:none">
  <div class="header">
    <h1 id="name"></h1>
    <div class="instructor" id="instructor"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div id="lock-card"></div>
  <div id="on-demand-note"></div>

  <div class="card" id="summary-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="section-title" style="margin-bottom:0">総合評価</div>
      <div id="review-count" style="font-size:11px;color:#94a3b8"></div>
    </div>
    <div id="ratings"></div>
    <div id="rating-dist"></div>
    <details class="legend">
      <summary>★の意味を見る</summary>
      <div class="legend-body">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;text-align:center">
          <div style="color:#f59e0b;font-weight:700;font-size:10px;padding-bottom:6px"></div>
          <div style="color:#f59e0b;font-weight:700;font-size:10px;padding-bottom:6px">楽単度</div>
          <div style="color:#a78bfa;font-weight:700;font-size:10px;padding-bottom:6px">充実度</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;font-size:11px">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);align-items:center;background:#f8fafc;border-radius:8px;padding:5px 8px;text-align:center">
            <div style="font-size:12px;color:#e2e8f0">★☆☆☆☆</div>
            <div style="color:#64748b">修羅場</div>
            <div style="color:#64748b">ほぼ学びなし</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:5px 8px;text-align:center">
            <div style="font-size:12px"><span style="color:#fbbf24">★★</span><span style="color:#e2e8f0">☆☆☆</span></div>
            <div style="color:#64748b">大変</div>
            <div style="color:#64748b">ちょい学び</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);align-items:center;background:#f8fafc;border-radius:8px;padding:5px 8px;text-align:center">
            <div style="font-size:12px"><span style="color:#f59e0b">★★★</span><span style="color:#e2e8f0">☆☆</span></div>
            <div style="color:#64748b">標準</div>
            <div style="color:#64748b">まあまあ学びあり</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:5px 8px;text-align:center">
            <div style="font-size:12px"><span style="color:#f59e0b">★★★★</span><span style="color:#e2e8f0">☆</span></div>
            <div style="color:#64748b">楽々</div>
            <div style="color:#64748b">かなり学べた</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);align-items:center;background:#f8fafc;border-radius:8px;padding:5px 8px;text-align:center">
            <div style="font-size:12px;color:#f59e0b">★★★★★</div>
            <div style="color:#64748b">天国</div>
            <div style="color:#64748b">めちゃくちゃ学べた</div>
          </div>
        </div>
      </div>
    </details>
  </div>

  <div id="review-controls" class="review-controls"></div>
  <div id="reviews-section"></div>

  <p style="font-size:11px;color:#94a3b8;text-align:center;margin:8px 0 0">
    掲載内容に問題があれば<a href="/contact" target="_blank" style="color:#6366f1;text-decoration:underline">お問い合わせフォーム</a>までご連絡ください
  </p>

  <div class="actions">
    <a id="btn-review" class="btn btn-primary" href="#">✏️ レビューを投稿</a>
    <a id="btn-syllabus" class="btn btn-secondary" href="#" style="display:none">📄 シラバスを見る</a>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "{{ liff_id }}";
const REGISTER_LIFF_ID = "{{ register_liff_id }}";
const REVIEW_FORM_URL = "{{ review_form_url }}";
const REVIEW_LIFF_ID = "{{ review_liff_id }}";
const BASE_URL = "{{ base_url }}";
const UNLOCK_REWARD = {{ unlock_reward }};

// 修正理由: レビュー閲覧には会員登録を必須にするため、未登録の間はページ本体を
// ブラー＋オーバーレイで覆って触れなくし、会員登録へ誘導する
// この機構（.blurredクラス・#authOverlay構造・showAuthOverlay/hideAuthOverlay）は
// templates/form_index.html（showOverlay/hideOverlay）・templates/contact.htmlにも
// 同種の実装が存在する。表示要素のID体系（本ファイルはcontent、form_index.htmlは
// formWrapper）とCSS基盤（本ファイルは独自<style>、form_index.htmlはTailwind）が異なり
// 共通部品化はしていないため、ゲートの見た目・文言・タイミングを変更する場合は
// 他の2ファイルも合わせて確認すること
function showAuthOverlay(html) {
  document.getElementById("authOverlayBox").innerHTML = html;
  document.getElementById("authOverlay").style.display = "flex";
  document.getElementById("content").classList.add("blurred");
}

function hideAuthOverlay() {
  document.getElementById("authOverlay").style.display = "none";
  document.getElementById("content").classList.remove("blurred");
}

function stars(n) {
  if (!n) return "";
  const full = Math.round(n);
  return "★".repeat(full) + "☆".repeat(5 - full);
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const EASE_STARS = { C: "★☆☆☆☆", B: "★★☆☆☆", A: "★★★☆☆", S: "★★★★☆", SS: "★★★★★" };

function buildLockCardHtml(data, userId, isInClient, profileFetchFailed) {
  let html = `<div class="card" style="border:2px solid var(--accent)">`;
  html += `<div class="section-title">🔒 レビューを見るには解除が必要です</div>`;
  html += `<div style="font-size:13px;color:#475569;line-height:1.6;margin-bottom:14px">`
        + `この科目には${data.review_count}件のレビューがあります。</div>`;
  if (userId) {
    const credits = data.unlock_credits || 0;
    html += `<div style="border:1px solid #e9ecf0;border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:7px">`
          + `<div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:#64748b">所持チケット</span><span style="font-weight:700;color:#1f2937">${credits}枚</span></div>`
          + `<div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:#64748b">この科目の解除に必要</span><span style="font-weight:700;color:#1f2937">1枚</span></div>`
          + `<div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:#64748b">レビュー1件が承認されると</span><span style="font-weight:700;color:#1f2937">+${UNLOCK_REWARD}枚</span></div>`
          + `</div>`;
    if (credits > 0) {
      html += `<button id="btn-unlock" class="btn btn-primary">🔓 チケットを1枚使って解除する</button>`;
    } else {
      // チケット0枚のときは「次のゴール」として視覚的に動機づける。
      // 承認は都度+${UNLOCK_REWARD}枚で累積式ではなく実データの途中経過が無いため、
      // 進捗バーではなく行動喚起の文言のみで表示する
      html += `<div style="background:#f5f3ff;border-radius:10px;padding:12px 14px;margin-bottom:14px">`
            + `<div style="font-size:12px;font-weight:700;color:#6d28d9;margin-bottom:6px">🎫 今はチケットが0枚です</div>`
            + `<div style="font-size:11.5px;color:#7c3aed;line-height:1.6">下の「レビューを投稿」からレビューを書いて承認されると、+${UNLOCK_REWARD}枚もらえます</div>`
            + `</div>`;
    }
  } else if (isInClient || profileFetchFailed) {
    // LINEアプリ内で開いているのにログイン情報が取得できなかった異常系。
    // 「LINEアプリから開いてください」は誤案内になるため、開き直しを促す
    html += `<div style="font-size:12px;background:#fff7ed;color:#9a3412;border-radius:8px;padding:10px 12px;line-height:1.6;margin-bottom:10px">`
          + `ログイン状態を確認できませんでした。お手数ですが、リッチメニューや科目一覧からこのページをもう一度開き直してください。</div>`
          + `<button id="btn-retry-login" class="btn btn-secondary">🔄 もう一度ログインする</button>`;
  } else {
    html += `<div style="font-size:12px;background:#fff7ed;color:#9a3412;border-radius:8px;padding:10px 12px;line-height:1.6">`
          + `解除するにはLINEアプリ内からこのページを開いてください。</div>`;
  }
  html += `</div>`;
  return html;
}

async function main() {
  let liffInitOk = true;
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch(e) {
    liffInitOk = false;
    console.warn("LIFF init failed", e);
  }

  const params = new URLSearchParams(location.search);
  const courseId = params.get("course_id");
  if (!courseId) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";
    document.getElementById("error").textContent = "科目IDが指定されていません。";
    return;
  }

  // LINEアプリ内（liff.isInClient()）なのにliff.isLoggedIn()がfalseの場合は、
  // 本来は自動ログインされているはずが何らかの理由で未ログイン状態になっている異常系。
  // 「LINEアプリから開いてください」と誤案内しないよう、まずliff.login()での復旧を試みる
  // （成功すると同じURLへリダイレクトされ、このmain()が再実行される）
  const isInClient = liffInitOk && (() => { try { return liff.isInClient(); } catch(e) { return false; } })();
  if (liffInitOk && isInClient) {
    try {
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }
    } catch(e) {
      console.warn("LIFF login check failed", e);
    }
  }

  // レビュー閲覧権の判定にLINEログイン情報が必要なため、科目データ取得より先にidTokenを
  // 確定させる（未ログイン時は空のまま進み、閲覧権なしとして扱われる）
  let userId = null;
  let idToken = "";
  let profileFetchFailed = false;
  try {
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      userId = profile.userId;
      idToken = await liff.getIDToken();
    }
  } catch(e) {
    profileFetchFailed = true;
    console.warn("LIFF getProfile/getIDToken failed", e);
  }

  const coursePromise = fetch(`${BASE_URL}/api/course/${courseId}?id_token=${encodeURIComponent(idToken)}`)
    .then(async res => {
      if (!res.ok) {
        let detail = "";
        if (res.status === 403) {
          try { detail = (await res.json()).detail || ""; } catch(e) {}
        }
        const err = new Error(detail || String(res.status));
        err.detail = detail;
        throw err;
      }
      return res.json();
    });

  // 修正理由: レビュー閲覧には会員登録を必須にするため、以前は未登録時に/registerへ
  // 即リダイレクトしていたが、コンテンツをブラーした状態で背後に見せつつオーバーレイで
  // 会員登録を促す方式に変更した（needsRegistrationがtrueのままmain()の最後まで進む）
  let needsRegistration = false;
  const registerUrl = REGISTER_LIFF_ID ? `https://liff.line.me/${REGISTER_LIFF_ID}` : `${BASE_URL}/register`;

  if (userId) {
    try {
      const statusRes = await fetch(`${BASE_URL}/api/profile/status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_token: idToken }),
      });
      const status = await statusRes.json();
      if (status.auth_failed) {
        // 修正理由: LINE側のID token検証が一時的に失敗しただけの場合も
        // found=falseになり、会員登録済みの本人を誤って未登録扱いしていた
        // バグの修正(2026-08-31)。検証失敗時はneedsRegistrationにフォール
        // バックする(会員登録誘導オーバーレイ止まりにする)
        needsRegistration = true;
      } else if (!status.complete) {
        needsRegistration = true;
      }
    } catch(e) {
      needsRegistration = true;
    }
  }

  let data;
  try {
    data = await coursePromise;
  } catch(e) {
    document.getElementById("loading").style.display = "none";
    const errEl = document.getElementById("error");
    if (e && e.detail) errEl.textContent = e.detail;
    errEl.style.display = "block";
    return;
  }

  // ── ヘッダー ──
  // 語尾バリアントグループ（例: 生物学各論A1/A2/C1/C2）に属する科目は、グループ名を
  // タイトルに表示し、レビューはグループ内の全科目分をまとめて表示する
  // （「レビューを投稿」ボタンのリンク先は元の科目名のまま、投稿フォーム側で解決する）
  document.getElementById("name").textContent = (data.locked ? "🔒 " : "") + (data.group_label || data.name);
  document.getElementById("instructor").textContent = data.instructor
    ? "👨‍🏫 " + data.instructor : "";

  const meta = document.getElementById("meta");
  if (data.group_label && data.group_variant_names && data.group_variant_names.length > 1) {
    const suffixes = data.group_variant_names.map(n =>
      n.startsWith(data.group_label) ? n.slice(data.group_label.length) : n);
    meta.insertAdjacentHTML("beforeend",
      `<span class="badge badge-variant">🔀 ${esc(suffixes.join('/'))}のレビューをまとめて表示</span>`);
  }
  if (data.classification)
    meta.insertAdjacentHTML("beforeend",
      `<span class="badge badge-cls">📂 ${esc(data.classification)}</span>`);
  if (data.term_type)
    meta.insertAdjacentHTML("beforeend",
      `<span class="badge badge-term">📅 ${esc(data.term_type)}</span>`);
  if (data.credits)
    meta.insertAdjacentHTML("beforeend",
      `<span class="badge badge-cr">🎓 ${esc(data.credits)}単位</span>`);

  if (data.note) {
    document.getElementById("on-demand-note").innerHTML =
      `<div class="card" style="padding:10px 14px;margin-bottom:0;font-size:12px;color:#4338ca;background:#eef2ff">${esc(data.note)}</div>`;
  }

  // ── 総合評価 ──
  const RATING_LABELS = ['', 'ほぼ学びなし', 'ちょい学び', 'まあまあ学びあり', 'かなり学べた', 'めちゃくちゃ学べた'];
  const EASE_LABELS  = { C: '修羅場', B: '大変', A: '標準', S: '楽々', SS: '天国' };

  // ── ロック中の解除カード（ページ最上部、ヘッダー直下に表示） ──
  const lockCard = document.getElementById("lock-card");
  if (data.locked) {
    lockCard.innerHTML = buildLockCardHtml(data, userId, isInClient, profileFetchFailed);
    const btn = document.getElementById("btn-unlock");
    if (btn) {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = "解除中...";
        try {
          const res = await fetch(`${BASE_URL}/api/course/${courseId}/unlock`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id_token: idToken }),
          });
          const result = await res.json();
          if (result.ok) {
            location.reload();
          } else {
            btn.disabled = false;
            btn.textContent = originalText;
            alert("閲覧チケットが不足しています。");
          }
        } catch(e) {
          btn.disabled = false;
          btn.textContent = originalText;
          alert("解除に失敗しました。もう一度お試しください");
        }
      });
    }
    const retryBtn = document.getElementById("btn-retry-login");
    if (retryBtn) {
      retryBtn.addEventListener("click", () => {
        try {
          liff.login({ redirectUri: location.href });
        } catch(e) {
          location.reload();
        }
      });
    }
  }

  // ── レビュー件数（総合評価の信頼度が一目でわかるよう★の横に件数を出す） ──
  const reviewCountEl = document.getElementById("review-count");
  if (!data.locked && data.review_count > 0) {
    reviewCountEl.textContent = `${data.review_count}件のレビュー`;
  }

  const ratingsEl = document.getElementById("ratings");
  if (data.locked) {
    ratingsEl.innerHTML = `<div class="no-review">🔒 上の「解除する」ボタンで解除すると表示されます</div>`;
  } else if (data.avg_rating != null) {
    const rLabel = RATING_LABELS[Math.round(data.avg_rating)] || '';
    let ratingsHtml = '';
    if (data.top_ease) {
      const eLabel = EASE_LABELS[data.top_ease] || '';
      ratingsHtml += `<div class="rating-row">
           <span class="rating-label">楽単度</span>
           <span class="stars" style="color:#f59e0b">${EASE_STARS[data.top_ease] || ""}</span>
           <span style="font-size:12px;color:#64748b;margin-left:6px">${eLabel}</span>
         </div>`;
    }
    ratingsHtml += `<div class="rating-row">
         <span class="rating-label">充実度</span>
         <span class="stars" style="color:#a78bfa">${stars(data.avg_rating)}</span>
         <span style="font-size:12px;color:#64748b;margin-left:6px">${rLabel}</span>
       </div>`;
    ratingsEl.innerHTML = ratingsHtml;
  } else {
    ratingsEl.innerHTML = `<div class="no-review">⭐ まだレビューはありません。あなたが最初のレビュワーになりませんか？🌟</div>`;
  }

  // ── 評価の内訳（分布） ──
  // 平均・最頻値だけでは「1件だけ極端に低い評価がある」等が埋もれて見えないため、
  // 楽単度・充実度それぞれの件数分布をバー表示する（review_count===0や施錠中は表示しない）
  const distEl = document.getElementById("rating-dist");
  if (!data.locked && data.review_count > 0) {
    const easeOrder = ["SS", "S", "A", "B", "C"];
    const ratingOrder = ["5", "4", "3", "2", "1"];
    const easeDist = data.ease_distribution || {};
    const ratingDist = data.rating_distribution || {};
    let bars = '<div style="font-size:10px;font-weight:700;color:#64748b;margin-bottom:5px">楽単度</div>';
    for (const k of easeOrder) {
      const cnt = easeDist[k] || 0;
      const pct = data.review_count ? Math.round((cnt / data.review_count) * 100) : 0;
      bars += `<div class="dist-row">
        <span class="dist-label">${k}</span>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${pct}%;background:#f59e0b"></div></div>
        <span class="dist-count">${cnt}</span>
      </div>`;
    }
    bars += '<div style="font-size:10px;font-weight:700;color:#64748b;margin:10px 0 5px">充実度</div>';
    for (const k of ratingOrder) {
      const cnt = ratingDist[k] || 0;
      const pct = data.review_count ? Math.round((cnt / data.review_count) * 100) : 0;
      bars += `<div class="dist-row">
        <span class="dist-label">${k}★</span>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${pct}%;background:#a78bfa"></div></div>
        <span class="dist-count">${cnt}</span>
      </div>`;
    }
    distEl.innerHTML = `<details class="legend" style="margin-top:6px;padding-top:10px">
      <summary>評価の内訳を見る（${data.review_count}件）</summary>
      <div class="legend-body">${bars}</div>
    </details>`;
  }

  // ── レビューカード（1件ずつ） ──
  // ロック中の解除カード・ボタンはページ最上部（#lock-card）で既に組み立て済みのため、
  // ここではロック中は何も描画しない
  const reviewsSection = document.getElementById("reviews-section");
  const controlsEl = document.getElementById("review-controls");

  function buildReviewCard(r) {
    const card = document.createElement("div");
    card.className = "card" + (r.is_mine ? " mine" : "");
    const byLabel = r.nickname ? `ニックネーム ${esc(r.nickname)}` : "匿名";
    const instrLabel = r.instructor ? esc(r.instructor) : "担当教員不明";
    const yearLabel = r.academic_year ? `受講年度 ${r.academic_year}年` : "";
    let html = "";
    if (r.is_mine) {
      html += `<div class="mine-badge">✅ あなたの投稿</div>`;
    }
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">👨‍🏫 ${instrLabel}</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        ${yearLabel ? `<span style="font-size:10px;color:#94a3b8">📅 ${yearLabel}</span>` : ""}
        <span style="font-size:11px;color:#94a3b8">🏷️ ${byLabel}</span>
      </div>
    </div>`;
    if (r.ease_rating) {
      html += `<div class="rating-row">
        <span class="rating-label">楽単度</span>
        <span class="stars" style="color:#f59e0b">${EASE_STARS[r.ease_rating] || ""}</span>
      </div>`;
    }
    html += `<div class="rating-row">
      <span class="rating-label">充実度</span>
      <span class="stars" style="color:#a78bfa">${stars(r.rating)}</span>
    </div>`;
    const gmParts = r.grading_method || [];
    if (gmParts.length) {
      let gmHtml = '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #f1f5f9">';
      gmHtml += '<div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:.05em;margin-bottom:6px">📋 成績評価方法</div>';
      gmHtml += '<div style="display:flex;flex-direction:column;gap:5px">';
      for (const part of gmParts) {
        if (!part.label) {
          gmHtml += `<div style="font-size:12px;color:#374151">${esc(part.text)}</div>`;
        } else {
          gmHtml += `<div style="display:flex;align-items:baseline;gap:6px">
            <span style="font-size:10px;font-weight:700;color:var(--accent);background:#ede9fe;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0">${esc(part.label)}</span>
            <span style="font-size:12px;color:#374151;line-height:1.5">${esc(part.text)}</span>
          </div>`;
        }
      }
      gmHtml += '</div></div>';
      html += gmHtml;
    }
    card.innerHTML = html;
    if (r.comment) {
      // 長文コメントは4行でクランプし「続きを読む」で展開する
      // （レビューが多い科目でスクロールが長くなりすぎるのを防ぐ）
      const box = document.createElement("div");
      box.className = "comment-box";
      box.style.marginTop = "8px";
      box.textContent = r.comment;
      card.appendChild(box);
      requestAnimationFrame(() => {
        if (box.scrollHeight > box.clientHeight + 2) {
          box.classList.add("clamped");
          const more = document.createElement("div");
          more.className = "comment-more";
          more.textContent = "続きを読む ▾";
          more.addEventListener("click", () => {
            const expanded = box.classList.toggle("clamped") === false;
            more.textContent = expanded ? "折りたたむ ▴" : "続きを読む ▾";
          });
          card.insertBefore(more, box.nextSibling);
        }
      });
    }
    return card;
  }

  let sortMode = "new";
  let instructorFilter = "";

  function renderReviewCards() {
    reviewsSection.innerHTML = "";
    let list = (data.reviews || []).slice();
    if (instructorFilter) {
      list = list.filter(r => r.instructor === instructorFilter);
    }
    if (sortMode === "rating") {
      list.sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.academic_year || 0) - (a.academic_year || 0));
    } else {
      // 「新しい順」= 受講年度が新しい順、同じ年度内は投稿日時が新しい順
      list.sort((a, b) => (b.academic_year || 0) - (a.academic_year || 0)
        || (new Date(b.created_at) - new Date(a.created_at)));
    }
    if (!list.length) {
      reviewsSection.innerHTML = `<div class="card"><div class="no-review">この条件に合うレビューはありません</div></div>`;
      return;
    }
    list.forEach(r => reviewsSection.appendChild(buildReviewCard(r)));
  }

  if (!data.locked && data.reviews && data.reviews.length) {
    // 担当教員が複数いる科目（バリアント統合科目等）は教員で絞り込めるようにする。
    // 1人しかいない場合はチップを出しても意味がないため表示しない
    const instructors = [...new Set(data.reviews.map(r => r.instructor).filter(Boolean))];
    let controlsHtml = "";
    if (instructors.length > 1) {
      controlsHtml += `<div class="filter-chips" id="instructor-chips">
        <button type="button" class="chip active" data-instr="">すべて</button>
        ${instructors.map(name => `<button type="button" class="chip" data-instr="${esc(name)}">${esc(name)}</button>`).join("")}
      </div>`;
    }
    if (data.reviews.length > 1) {
      controlsHtml += `<div class="sort-row">
        <select id="sort-select" class="sort-select">
          <option value="new">新しい順</option>
          <option value="rating">評価が高い順</option>
        </select>
      </div>`;
    }
    controlsEl.innerHTML = controlsHtml;

    const chipsEl = document.getElementById("instructor-chips");
    if (chipsEl) {
      chipsEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        chipsEl.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        instructorFilter = btn.dataset.instr;
        renderReviewCards();
        updateSyllabusButton();
      });
    }
    const sortEl = document.getElementById("sort-select");
    if (sortEl) {
      sortEl.addEventListener("change", () => {
        sortMode = sortEl.value;
        renderReviewCards();
      });
    }

    renderReviewCards();
  }

  // ── ボタン ──
  // 生のREVIEW_FORM_URLで開くとLINEの通常アプリ内ブラウザ扱いになりliff.isInClient()が
  // falseになるため、他のボタン（会員登録・科目詳細等）と同様にhttps://liff.line.me/{LIFF_ID}
  // 形式で開かせる（[[feedback_liff_links_must_use_liffline_me]]）。
  const reviewParams = userId
    ? `uid=${userId}&course=${encodeURIComponent(data.name)}`
    : `course=${encodeURIComponent(data.name)}`;
  const reviewUrl = REVIEW_LIFF_ID
    ? `https://liff.line.me/${REVIEW_LIFF_ID}?${reviewParams}`
    : `${REVIEW_FORM_URL}?${reviewParams}`;
  const btnReview = document.getElementById("btn-review");
  // レビュー投稿は教養科目のみ受け付けている（専門科目は既存レビューの閲覧のみ）
  if (data.category !== "教養") {
    btnReview.style.display = "none";
    btnReview.insertAdjacentHTML("beforebegin",
      `<p style="font-size:11.5px;color:#94a3b8;text-align:center;margin:8px 0 0">現在、レビュー投稿は教養科目のみ受け付けています</p>`);
  } else {
    btnReview.href = reviewUrl;
    // レビュー0件の科目は投稿ボタンの見た目を特別扱いし、供給が足りない科目への
    // 投稿を後押しする（review_count===0の科目はunlocked扱いなので必ずlocked===false）
    if (!data.locked && data.review_count === 0) {
      btnReview.insertAdjacentHTML("beforebegin",
        `<div style="text-align:center"><span style="font-size:11.5px;font-weight:700;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:999px;padding:5px 14px;display:inline-block">🌟 初レビューでチケット+${UNLOCK_REWARD}枚もらえます</span></div>`);
      btnReview.textContent = "✏️ 最初のレビューを書く";
      btnReview.style.boxShadow = "0 0 0 4px #e0e7ff, 0 6px 16px rgba(99,102,241,.35)";
    }
  }

  function updateSyllabusButton() {
    const sylBtn = document.getElementById("btn-syllabus");
    // 教員で絞り込み中はその教員のシラバスURLに切り替える。無ければボタン自体を隠す
    const url = instructorFilter
      ? (data.instructor_syllabus_urls || {})[instructorFilter] || ""
      : data.syllabus_url;
    if (url) {
      sylBtn.href = url;
      sylBtn.style.display = "block";
    } else {
      sylBtn.style.display = "none";
    }
  }
  updateSyllabusButton();

  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";

  if (needsRegistration) {
    // 登録ボタンだけを見せる文言のみの構成だと、登録する理由が伝わらず離脱しやすい。
    // 登録前に得られる3つの価値を先に見せてから登録導線に進ませる（[[project_liff_ux_improvements_20260830]]参照）
    showAuthOverlay(`<div class="icon">🎓</div>
      <p>⚠️ レビュー閲覧には会員登録が必要です</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;text-align:left">
        <div style="display:flex;align-items:center;gap:10px;background:#eef2ff;border-radius:10px;padding:9px 12px">
          <span style="font-size:16px">🔓</span>
          <span style="font-size:12.5px;color:#3730a3;font-weight:600">先輩たちのレビューがすぐ見られる</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;background:#eef2ff;border-radius:10px;padding:9px 12px">
          <span style="font-size:16px">✏️</span>
          <span style="font-size:12.5px;color:#3730a3;font-weight:600">レビューを書くとチケットが貯まる</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;background:#eef2ff;border-radius:10px;padding:9px 12px">
          <span style="font-size:16px">🎓</span>
          <span style="font-size:12.5px;color:#3730a3;font-weight:600">神戸大生なら誰でも30秒で完了</span>
        </div>
      </div>
      <a href="${registerUrl}" class="btn btn-primary" style="display:block;text-decoration:none">📝 今すぐ登録する（30秒）</a>
      <p style="font-size:11px;color:#94a3b8">登録することで<a href="/terms" target="_blank" style="color:#94a3b8;text-decoration:underline">利用規約</a>および<a href="/privacy" target="_blank" style="color:#94a3b8;text-decoration:underline">プライバシーポリシー</a>に同意したものとします。</p>`);
  } else {
    hideAuthOverlay();
  }
}

main();
</script>
</body>
</html>

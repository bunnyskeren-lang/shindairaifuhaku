<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 神大ライフハック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="{% if IS_DEV %}bg-gradient-to-br from-orange-50 to-amber-100{% else %}bg-gradient-to-br from-blue-50 to-indigo-100{% endif %} min-h-screen pb-16">

  <div class="max-w-md mx-auto px-4 pt-8">

    {% if IS_DEV %}
    <div class="bg-orange-500 text-white text-center text-sm font-bold py-2 px-4 rounded-2xl mb-4">
      🚧 開発環境
    </div>
    {% endif %}

    <div class="text-center mb-6">
      <div class="text-5xl mb-3">✉️</div>
      <h1 class="text-2xl font-bold text-gray-800">お問い合わせ</h1>
      <p class="text-gray-500 text-sm mt-1">ご質問、情報の誤りのご指摘、新しい情報の追加提案、情報のアップデート、誤字脱字のご指摘など、お気軽にお寄せください</p>
    </div>

    <div id="formWrapper" class="blurred">
    <form id="contactForm" action="/contact/submit" method="post" novalidate class="space-y-4">

      <input type="hidden" name="id_token" id="idTokenHidden" value="">

      <div id="studentIdCard" class="hidden bg-white rounded-2xl shadow-sm p-4 flex items-center gap-2">
        <span class="text-[11px] font-bold text-green-600 bg-green-50 rounded-full px-2.5 py-1 shrink-0">登録済み</span>
        <span class="text-sm text-gray-600"><span id="studentIdValue"></span> として送信されます</span>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-5">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          📋 お問い合わせの種類 <span class="text-red-500">*</span>
        </label>
        <input type="hidden" name="category" id="category">
        <div class="flex flex-wrap gap-2">
          {% for c in categories %}
          <button type="button" class="chip-btn single" data-group="category" data-value="{{ c }}">{{ c }}</button>
          {% endfor %}
        </div>
        <p id="categoryError" class="hidden mt-1 text-red-500 text-xs">お問い合わせの種類を選択してください</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-5">
        <label for="content" class="block text-sm font-semibold text-gray-700 mb-2">
          📝 お問い合わせ内容 <span class="text-red-500">*</span>
        </label>
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <span class="text-xs text-gray-400 shrink-0">タップで挿入👇</span>
          <button type="button" class="prompt-chip" data-prompt="【対象の科目名：　】">科目名を入れる</button>
          <button type="button" class="prompt-chip" data-prompt="【該当ページ：　】">該当ページ</button>
        </div>
        <textarea name="content" id="content" rows="6" maxlength="2000" required
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 transition resize-none"
          placeholder="できるだけ具体的にご記入ください（対象のページ・科目名など）"></textarea>
        <p id="contentError" class="hidden mt-1 text-red-500 text-xs">お問い合わせ内容を入力してください</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-5">
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
          📧 メールアドレス <span class="text-red-500">*</span>
        </label>
        <input type="email" name="email" id="email"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 transition"
          placeholder="例：example@gmail.com" required maxlength="200" autocomplete="email">
        <p id="emailError" class="hidden mt-1 text-red-500 text-xs">メールアドレスの形式が正しくありません</p>
      </div>

      <div class="bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 text-sm text-amber-700">
        本お問い合わせについて、運営側からご連絡させていただくことがあります。メールアドレスは普段使うものをご入力ください。
      </div>

      <button type="submit" id="submitBtn" disabled
        class="w-full bg-gray-300 text-white font-bold py-3.5 rounded-2xl transition text-sm shadow-sm cursor-not-allowed">
        送信する
      </button>
    </form>
    </div>
  </div>

  <div id="authOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
    <div id="authOverlayBox" class="bg-white rounded-2xl shadow-xl p-6 max-w-xs w-full text-center space-y-3">
      <div class="text-4xl">⏳</div>
      <p class="text-sm text-gray-500">確認中...</p>
    </div>
  </div>

  <style>
    .blurred { filter: blur(6px); pointer-events: none; user-select: none; }
    .chip-btn {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 2px solid #e5e7eb;
      color: #6b7280;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .chip-btn:active { transform: scale(0.95); }
    .chip-btn.active {
      border-color: #6366f1;
      color: #6366f1;
      background: #eef2ff;
    }
    .prompt-chip {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid #e0e7ff;
      color: #6366f1;
      background: #f5f3ff;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .prompt-chip:active { transform: scale(0.95); background: #ede9fe; }
  </style>

  <script>
    document.querySelectorAll('[data-group="category"]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-group="category"]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('category').value = btn.dataset.value;
        document.getElementById('categoryError').classList.add('hidden');
      });
    });

    document.querySelectorAll('.prompt-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const el = document.getElementById('content');
        const prompt = chip.dataset.prompt;
        const cur = el.value;
        if (cur && !cur.endsWith('\n') && !cur.endsWith(' ') && !cur.endsWith('、')) el.value = cur + '\n';
        el.value += prompt;
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
        document.getElementById('contentError').classList.add('hidden');
      });
    });

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      const categoryInput = document.getElementById('category');
      const contentInput = document.getElementById('content');
      const emailInput = document.getElementById('email');
      const categoryError = document.getElementById('categoryError');
      const contentError = document.getElementById('contentError');
      const emailError = document.getElementById('emailError');
      const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

      contentInput.value = contentInput.value.trim();
      emailInput.value = emailInput.value.trim();

      categoryError.classList.toggle('hidden', !!categoryInput.value);
      contentError.classList.toggle('hidden', !!contentInput.value);
      const emailOk = EMAIL_RE.test(emailInput.value);
      emailError.classList.toggle('hidden', emailOk);

      if (!categoryInput.value || !contentInput.value || !emailOk || !document.getElementById('idTokenHidden').value) {
        e.preventDefault();
      }
    });

    // ── LIFF初期化とログインチェック ──
    // 修正理由: お問い合わせは会員登録(メール認証)が完了していない状態でも送信できる必要が
    // ある(メール認証で詰まったユーザーの問い合わせ手段として案内しているため、ここで会員登録を
    // 要求すると詰まったまま問い合わせもできない詰み状態になる)。LINEログインのみを必須とする。
    const LIFF_ID = "{{ liff_id }}";

    function showOverlay(html) {
      document.getElementById('authOverlayBox').innerHTML = html;
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('formWrapper').classList.add('blurred');
    }

    function hideOverlay() {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('formWrapper').classList.remove('blurred');
    }

    function enableSubmit() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.textContent = '送信する';
      btn.className = 'w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl hover:bg-indigo-700 transition text-sm shadow-sm';
    }

    async function initAuthCheck() {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        showOverlay(`<div class="text-4xl">⚠️</div>
          <p class="text-sm text-gray-500">LINEログインの確認に失敗しました。リッチメニューからこのページを開き直してください。</p>`);
        return;
      }

      const isInClient = (() => { try { return liff.isInClient(); } catch (e) { return false; } })();
      if (isInClient && !liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }

      if (!liff.isLoggedIn()) {
        showOverlay(`<div class="text-4xl">📱</div>
          <p class="text-sm text-gray-500">お問い合わせにはLINEログインが必要です。</p>
          <button type="button" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">LINEでログイン</button>`);
        document.getElementById('loginBtn').onclick = () => liff.login({ redirectUri: location.href });
        return;
      }

      let idToken;
      try {
        idToken = await liff.getIDToken();
      } catch (e) {
        idToken = null;
      }
      if (!idToken) {
        showOverlay(`<div class="text-4xl">⚠️</div>
          <p class="text-sm text-gray-500">ログイン情報の取得に失敗しました。もう一度お試しください。</p>`);
        return;
      }

      let data;
      try {
        const res = await fetch('/api/profile/prefill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: idToken }),
        });
        data = await res.json();
      } catch (e) {
        showOverlay(`<div class="text-4xl">⚠️</div>
          <p class="text-sm text-gray-500">通信に失敗しました。もう一度お試しください。</p>`);
        return;
      }

      document.getElementById('idTokenHidden').value = idToken;
      if (data.found) {
        document.getElementById('studentIdValue').textContent = data.student_id;
        document.getElementById('studentIdCard').classList.remove('hidden');
      }
      hideOverlay();
      enableSubmit();
    }
    initAuthCheck();
  </script>
</body>
</html>

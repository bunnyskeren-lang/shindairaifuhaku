<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メール確認 | 神大ライフハック</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center px-4">
  <div class="max-w-sm w-full">
    <div class="bg-white rounded-3xl shadow-sm p-8 text-center">
      <div class="text-6xl mb-4">📧</div>
      <h1 class="text-xl font-bold text-gray-800 mb-2">メールアドレスの確認</h1>
      <p class="text-gray-500 text-sm mb-6">下のボタンを押して、本人確認を完了してください。</p>

      <form action="/api/email/verify" method="post" onsubmit="this.querySelector('button').disabled=true;">
        <input type="hidden" name="token" value="{{ token }}">
        <button type="submit"
          class="block w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl hover:bg-indigo-700 transition text-sm">
          本人確認を完了する
        </button>
      </form>
    </div>
  </div>
</body>
</html>
